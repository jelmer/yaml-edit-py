[package]
name = "yaml-edit-py"
version = "0.1.4"
edition = "2021"
authors = ["Jelmer Vernooĳ <jelmer@debian.org>"]
license = "Apache-2.0"
description = "Python bindings for the yaml-edit lossless YAML parser and editor"
repository = "https://github.com/jelmer/yaml-edit-py"
publish = false

[lib]
name = "_yaml_edit"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = ">=0.29,<0.31", features = ["extension-module"] }
yaml-edit = "0.3.3"
# Only for `rowan::ast::AstNode`, to reach the syntax nodes behind yaml-edit's
# wrappers; keep in step with the rowan version yaml-edit uses.
rowan = "0.16"
